# Search macros for the 5 scenario alerts
# Copy into $SPLUNK_HOME/etc/apps/<your app>/local/macros.conf, or add each one in
#   Settings > Advanced search > Search macros (name = the [stanza], definition = the definition line)
# Change the index and sourcetype (index=secops sourcetype=JM_json, index=defender) to your own.
# Field names (type, subtype, logdesc, action, devname, ...) are FortiGate log fields.

# Firewall traffic logs (accepted / closed sessions)
[cip_sc_traffic]
definition = (index=secops sourcetype=JM_json type=traffic subtype=forward action IN ("accept","close"))
iseval = 0

# Firewall threat and admin login logs: blocked web filter, antivirus, admin login success / failure
[cip_sc_threat_logs]
definition = (index=secops sourcetype=JM_json ((type=utm ((subtype=webfilter action=blocked) OR subtype=virus)) OR (type=event logdesc IN ("Admin login successful","Admin login failed"))))
iseval = 0

# Firewall DHCP logs of the last 7 days: internal IP -> PC name
[cip_sc_dhcp]
definition = index=secops sourcetype=JM_json logdesc="DHCP Ack log" earliest=-7d latest=now | eval dhcp_ip=ip, dhcp_host=hostname
iseval = 0

# Defender malware alerts (used by the malware scenario)
[cip_sc_defender_alerts]
definition = index=defender category=Malware
iseval = 0

# Common field names for traffic logs (the first field that has a value)
[cip_sc_normalize]
definition = eval ab_src=coalesce(srcip, src_ip), ab_dst=coalesce(dstip, dest_ip), ab_dport=coalesce(dstport, dest_port), ab_proto=coalesce(proto, transport), ab_fw=coalesce(devname, dvc_name, host), ab_sess=coalesce(devname, dvc_name, host)."|".coalesce(sessionid, session_id, srcport, src_port), ab_pc=rtrim(coalesce(srcname, "")), ab_user=coalesce(user, src_user)
iseval = 0

# Common field names for threat and login logs (the first field that has a value)
[cip_sc_threat_normalize]
definition = eval ab_t_kind=case(in(coalesce(subtype, log_subtype), "webfilter", "url"), "web", in(coalesce(subtype, log_subtype), "virus", "wildfire-virus"), "av", like(logdesc, "Admin login%"), "login", true(), "other"), ab_trig=if(ab_t_kind="other", 0, 1), ab_t_host=coalesce(hostname, dest_hostname, dest_name), ab_t_url=url, ab_t_name=coalesce(virus, threat_name), ab_t_file=coalesce(filename, file_name), ab_t_source=coalesce(subtype, log_subtype), ab_t_dst=coalesce(dstip, dest_ip), ab_l_result=case(like(logdesc, "%successful"), "success", like(logdesc, "%failed"), "failure"), ab_l_user=coalesce(user, src_user), ab_l_device=coalesce(devname, dvc_name, host), ab_l_dst=coalesce(dstip, dest_ip), ab_l_method=method, ab_l_status=status
iseval = 0
