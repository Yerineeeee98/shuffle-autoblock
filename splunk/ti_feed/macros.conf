# Search macros for the TI feed auto-block alert
# Add them to the TA-cip-ti-feed app: $SPLUNK_HOME/etc/apps/TA-cip-ti-feed/local/macros.conf,
#   or Settings > Advanced search > Search macros (app: TA-cip-ti-feed)
# They use cip_ti_traffic_all, cip_ti_normalize, cip_ti_index, cip_ti_severity and the lookup cip_ti_alert_scope,
#   which come with the TA-cip-ti-feed app.
# Change the index and sourcetype in cip_ab_dhcp_logs (index=secops sourcetype=JM_json) to your own.

# Firewall logs: traffic logs of the TI app, and threat logs (IPS, antivirus, web filter) in the same indexes
[cip_ab_logs]
definition = ((`cip_ti_traffic_all`) OR ([ search `cip_ti_traffic_all` earliest=-15m@m latest=now | stats count BY index | fields index | appendpipe [ stats count | where count=0 | eval index="cip_ab_no_index" | fields index ] ] ((type=utm (subtype=ips OR subtype=virus OR subtype=webfilter)) OR (sourcetype="pan:threat" (log_subtype="vulnerability" OR log_subtype="virus" OR log_subtype="wildfire-virus" OR log_subtype="url")))))
iseval = 0

# Common field names and flags for FortiGate and Palo Alto logs (traffic / IPS / antivirus / web filter, direction, session)
[cip_ab_normalize]
definition = `cip_ti_normalize` | eval ab_pan=if(like(sourcetype,"pan:%"),1,0) | fillnull value="-" vd srcport dstport proto direction action session_id | eval ab_is_traffic=if(ab_pan=1, if(sourcetype="pan:traffic",1,0), if(type="traffic",1,0)), ab_kind=if(ab_pan=1, case(sourcetype="pan:traffic","traffic", log_subtype="vulnerability","ips", in(log_subtype,"virus","wildfire-virus"),"virus", log_subtype="url","webfilter", true(),log_subtype), if(type="utm",subtype,"traffic")), ab_ips=if(ab_pan=1, if(sourcetype="pan:threat" AND log_subtype="vulnerability" AND in(lower(severity),"critical","high"),1,0), if(type="utm" AND subtype="ips" AND in(severity,"critical","high"),1,0)), ab_av=if(ab_pan=1, if(sourcetype="pan:threat" AND in(log_subtype,"virus","wildfire-virus"),1,0), if(type="utm" AND subtype="virus" AND isnotnull(virus),1,0)), ab_web=if(ab_pan=1, if(sourcetype="pan:threat" AND log_subtype="url" AND match(lower(coalesce(raw_category,"")),"(^|,)(malware|phishing)(,|$)"),1,0), if(type="utm" AND subtype="webfilter" AND in(tostring(cat),"26","61"),1,0)), ab_from_init=case(direction="outgoing",1, direction="incoming",0, direction="client-to-server",1, direction="server-to-client",0, true(),-1), ab_cat_en=case(tostring(cat)="26","Malicious Websites", tostring(cat)="61","Phishing", isnotnull(cat),"Category ".cat, true(),null()), ab_detect=if(ab_pan=1, coalesce(threat_name,raw_category,"-"), coalesce(attack,virus,ab_cat_en,"-")), ab_site=if(ab_pan=1, coalesce(misc,""), coalesce(hostname,"")), ab_name=ab_detect." ".ab_site, ab_dir_text=direction, ab_action=if(ab_pan=1, coalesce(vendor_action,action,"-"), action), ab_session=if(ab_pan=1, devname."|".session_id, vd."|".srcport."|".dstport."|".proto."|".sessionid) | fields - ab_pan ab_cat_en
iseval = 0

# Firewall DHCP logs: internal IP -> PC name
[cip_ab_dhcp_logs]
definition = index=secops sourcetype=JM_json logdesc="DHCP Ack log"
iseval = 0

# Health check: counts the logs and empty fields, and gives a verdict (OK / Warning / Problem)
[cip_ab_health]
definition = `cip_ab_normalize` | eval f_traffic=if(ab_is_traffic=1,1,0), f_threat=if(ab_is_traffic=0,1,0), f_nodir=if(ab_is_traffic=0 AND ab_from_init=-1,1,0), f_noip=if(isnull(srcip) OR srcip="" OR isnull(dstip) OR dstip="",1,0), f_nodev=if(isnull(devname) OR devname="",1,0), f_nosess=if(isnull(ab_session) OR ab_session="",1,0) | stats count AS n_all sum(f_traffic) AS n_traffic sum(f_threat) AS n_threat sum(ab_ips) AS n_ips sum(ab_av) AS n_av sum(ab_web) AS n_web sum(f_nodir) AS n_nodir sum(f_noip) AS n_noip sum(f_nodev) AS n_nodev sum(f_nosess) AS n_nosess dc(devname) AS n_dev | eval verdict=case(n_all=0,"Problem: No logs (check cip_ab_logs)", n_traffic=0,"Problem: No traffic logs (check the TI app log location or the traffic split in cip_ab_normalize)", n_noip*20>n_all,"Problem: 5%+ logs missing source/destination (check the TI adapter)", n_nodev*20>n_all,"Problem: 5%+ logs missing device name (check the TI adapter)", n_nosess*20>n_all,"Problem: 5%+ logs missing session value (check the session number in cip_ab_normalize)", n_threat>0 AND n_nodir*20>n_threat,"Warning: 5%+ threat logs with unknown direction (check the direction in cip_ab_normalize)", n_threat=0,"Warning: No threat logs (there may have been no detections. If it lasts all day, check the threat log location in cip_ab_logs)", true(),"OK")
iseval = 0
